name: Validate

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  pdf-cli-skills:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Install ShellCheck
        if: runner.os == 'Linux'
        run: sudo apt-get install -y shellcheck

      - name: Validate PDF CLI skills
        run: python3 scripts/validate-pdf-cli-skills.py

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.10"

      - name: Install remediate-pdf test dependencies
        run: python -m pip install "httpx>=0.27" "pypdf>=7.1.1"

      - name: Run offline remediate-pdf tests
        shell: bash
        working-directory: plugins/remediate-pdf/skills/remediate-pdf
        env:
          NUTRIENT_ACCESSIBILITY_API_KEY: ""
          NUTRIENT_API_KEY: ""
        run: |
          python scripts/test_autotag.py
          python scripts/test_validate.py
          python tests/smoke_autotag.py
